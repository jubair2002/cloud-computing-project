services:
  backend:
    build:
      context: ./back-end
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_NAME: ShopHub
      # Safe-by-default: debug off unless explicitly opted into via the root
      # .env, so a straight `docker compose up` on a real host never leaks
      # stack traces. Set APP_ENV=local and APP_DEBUG=true in .env for local
      # debugging (same override pattern as DEMO_MODE below).
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: http://${PUBLIC_HOST:-localhost}:${BACKEND_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MYSQL_ATTR_SSL_CA: ${MYSQL_ATTR_SSL_CA:-}
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      MAIL_MAILER: log
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:5173,127.0.0.1:5173}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_SANDBOX_CONFIRMED: ${DEMO_SANDBOX_CONFIRMED:-false}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
      DEMO_CUSTOMER_EMAIL: ${DEMO_CUSTOMER_EMAIL}
      DEMO_CUSTOMER_PASSWORD: ${DEMO_CUSTOMER_PASSWORD}
    volumes:
      - backend-storage:/var/www/html/storage

  frontend:
    build:
      context: ./front-end
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: http://${PUBLIC_HOST:-localhost}:${BACKEND_PORT:-8000}/api
    depends_on:
      - backend

volumes:
  backend-storage:
