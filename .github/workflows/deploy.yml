name: Deploy ShopHub to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shophub-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend to EC2 backend host
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend source and env on backend EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.BACKEND_DEPLOY_DIR || '$HOME/shophub' }}"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Use an authenticated URL when a PAT is provided (required for
            # private repos); fall back to a plain clone for public repos.
            REPO_URL="https://github.com/${{ github.repository }}.git"
            if [ -n "${{ secrets.GH_PAT }}" ]; then
              REPO_URL="https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"
            fi

            git init >/dev/null 2>&1 || true
            git remote set-url origin "$REPO_URL" || git remote add origin "$REPO_URL"
            git fetch --depth 1 origin main
            git reset --hard origin/main

            cat > .env << 'ENVEOF'
            ${{ secrets.BACKEND_PROD_ENV_FILE }}
            ENVEOF
            chmod 600 .env

            # Pass-through env vars for docker-compose.yml (the compose file's
            # backend service must declare these as bare `- VAR_NAME` entries
            # for docker compose to forward them into the container).
            export DB_HOST="${{ secrets.DB_HOST }}"
            export DB_PORT="${{ secrets.DB_PORT || '3306' }}"
            export DB_DATABASE="${{ secrets.DB_DATABASE }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export BACKEND_PORT="${{ secrets.BACKEND_PORT || '8000' }}"
            export PUBLIC_HOST="${{ secrets.EC2_BACKEND_HOST }}"
            export FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
            export SANCTUM_STATEFUL_DOMAINS="${{ secrets.SANCTUM_STATEFUL_DOMAINS }}"

            if command -v systemctl >/dev/null 2>&1; then
              sudo systemctl enable --now docker >/dev/null 2>&1 || true
            fi

            set_compose_cmd() {
              if docker compose version >/dev/null 2>&1; then
                COMPOSE_CMD="docker compose"
                return 0
              fi

              if command -v docker-compose >/dev/null 2>&1; then
                COMPOSE_CMD="docker-compose"
                return 0
              fi

              return 1
            }

            if ! set_compose_cmd && command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin || \
              sudo apt-get install -y docker-compose-v2 || \
              sudo apt-get install -y docker-compose
              set_compose_cmd
            fi

            if [ -z "${COMPOSE_CMD:-}" ]; then
              echo "Docker Compose is not installed on this host." >&2
              exit 1
            else
              echo "Using $COMPOSE_CMD"
            fi

            $COMPOSE_CMD up -d --build backend
            $COMPOSE_CMD ps backend
            if ! curl -fsS --retry 12 --retry-delay 5 --retry-connrefused --max-time 10 "http://127.0.0.1:${BACKEND_PORT}/up"; then
              $COMPOSE_CMD logs --tail=200 backend
              exit 1
            fi
            docker image prune -f

      - name: Backend health check
        run: |
          curl -fsS --max-time 10 "http://${{ secrets.EC2_BACKEND_HOST }}:${{ secrets.BACKEND_PORT || '8000' }}/up"

  deploy-frontend:
    name: Build and deploy frontend to EC2 frontend host
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install frontend dependencies
        working-directory: front-end
        run: npm ci

      - name: Resolve build variables
        # If VITE_API_BASE_URL isn't set directly, derive it from
        # BACKEND_PUBLIC_HOST (falling back to EC2_BACKEND_HOST) so you
        # only ever need to keep one host value up to date.
        run: |
          set -e
          if [ -n "${{ secrets.VITE_API_BASE_URL }}" ]; then
            API_URL="${{ secrets.VITE_API_BASE_URL }}"
          else
            BACKEND_PUBLIC_HOST="${{ secrets.BACKEND_PUBLIC_HOST || secrets.EC2_BACKEND_HOST }}"
            API_URL="http://${BACKEND_PUBLIC_HOST}:${{ secrets.BACKEND_PORT || '8000' }}/api"
          fi
          echo "VITE_API_BASE_URL=$API_URL" >> "$GITHUB_ENV"

      - name: Build frontend bundle
        working-directory: front-end
        run: |
          test -n "$VITE_API_BASE_URL"
          npm run build

      - name: Prepare frontend deploy directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            FRONTEND_DEPLOY_DIR="${{ secrets.FRONTEND_DEPLOY_DIR || '/var/www/html' }}"
            if command -v apt-get >/dev/null 2>&1 && ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y nginx
            fi

            sudo mkdir -p "$FRONTEND_DEPLOY_DIR"
            sudo chown -R "$USER:$USER" "$FRONTEND_DEPLOY_DIR"
            find "$FRONTEND_DEPLOY_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

            if command -v nginx >/dev/null 2>&1; then
              sudo tee /etc/nginx/sites-available/default >/dev/null <<NGINXEOF
            server {
                listen 80 default_server;
                listen [::]:80 default_server;

                root $FRONTEND_DEPLOY_DIR;
                index index.html;

                location / {
                    try_files \$uri \$uri/ /index.html;
                }
            }
            NGINXEOF
              sudo nginx -t
              sudo systemctl enable --now nginx
            fi

      - name: Upload dist folder to frontend EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "front-end/dist/*"
          target: "${{ secrets.FRONTEND_DEPLOY_DIR || '/var/www/html' }}"
          strip_components: 2
          overwrite: true

      - name: Restart frontend web server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            if command -v nginx >/dev/null 2>&1; then
              sudo nginx -t
              sudo systemctl reload nginx || sudo systemctl restart nginx
            fi

      - name: Frontend smoke test
        run: |
          curl -fsS --max-time 10 "http://${{ secrets.EC2_FRONTEND_HOST }}"
          curl -fsS --max-time 10 "$VITE_API_BASE_URL/products"