name: Deploy ShopHub to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shophub-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend to EC2 backend host
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend source and env on backend EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            mkdir -p "${{ secrets.BACKEND_DEPLOY_DIR || '$HOME/shophub' }}"
            cd "${{ secrets.BACKEND_DEPLOY_DIR || '$HOME/shophub' }}"

            git init >/dev/null 2>&1 || true
            git remote set-url origin https://github.com/${{ github.repository }}.git || git remote add origin https://github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main

            cat > .env << 'ENVEOF'
            ${{ secrets.BACKEND_PROD_ENV_FILE }}
            ENVEOF
            chmod 600 .env

            # Make sure the runtime env file carries the secrets the backend container
            # needs to talk to the managed RDS database.
            export DB_HOST="${{ secrets.DB_HOST }}"
            export DB_PORT="${{ secrets.DB_PORT || '3306' }}"
            export DB_DATABASE="${{ secrets.DB_DATABASE }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"

            docker compose up -d --build backend
            docker image prune -f

      - name: Backend health check
        run: |
          curl -fsS --max-time 10 "http://${{ secrets.EC2_BACKEND_HOST }}:${{ secrets.BACKEND_PORT || '8000' }}/up" || \
          echo "::warning::Backend /up did not respond from the backend EC2 host."

  deploy-frontend:
    name: Build and deploy frontend to EC2 frontend host
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install frontend dependencies
        working-directory: front-end
        run: npm ci

      - name: Build frontend bundle
        working-directory: front-end
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || format('http://{0}:8000/api', secrets.BACKEND_PUBLIC_HOST) }}
        run: npm run build

      - name: Upload dist folder to frontend EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "front-end/dist/*"
          target: "${{ secrets.FRONTEND_DEPLOY_DIR }}"
          strip_components: 0

      - name: Frontend smoke test
        run: |
          curl -fsS --max-time 10 "http://${{ secrets.EC2_FRONTEND_HOST }}" || \
          echo "::warning::Frontend EC2 smoke check did not return a valid page response."