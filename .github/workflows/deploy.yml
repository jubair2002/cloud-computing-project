name: Deploy ShopHub to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shophub-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend to EC2 backend host
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend source and env on backend EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            mkdir -p "${{ secrets.BACKEND_DEPLOY_DIR || '$HOME/shophub' }}"
            cd "${{ secrets.BACKEND_DEPLOY_DIR || '$HOME/shophub' }}"

            git init >/dev/null 2>&1 || true
            git remote set-url origin https://github.com/${{ github.repository }}.git || git remote add origin https://github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main

            cat > .env << 'ENVEOF'
            ${{ secrets.BACKEND_PROD_ENV_FILE }}
            ENVEOF
            chmod 600 .env

            # Make sure the runtime env file carries the secrets the backend container
            # needs to talk to the managed RDS database.
            export DB_HOST="${{ secrets.DB_HOST }}"
            export DB_PORT="${{ secrets.DB_PORT || '3306' }}"
            export DB_DATABASE="${{ secrets.DB_DATABASE }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"

            if command -v systemctl >/dev/null 2>&1; then
              sudo systemctl enable --now docker >/dev/null 2>&1 || true
            fi

            set_compose_cmd() {
              if docker compose version >/dev/null 2>&1; then
                COMPOSE_CMD="docker compose"
                return 0
              fi

              if command -v docker-compose >/dev/null 2>&1; then
                COMPOSE_CMD="docker-compose"
                return 0
              fi

              return 1
            }

            if ! set_compose_cmd && command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin || \
              sudo apt-get install -y docker-compose-v2 || \
              sudo apt-get install -y docker-compose
              set_compose_cmd
            fi

            if [ -z "${COMPOSE_CMD:-}" ]; then
              echo "Docker Compose is not installed on this host." >&2
              exit 1
            else
              echo "Using $COMPOSE_CMD"
            fi

            $COMPOSE_CMD up -d --build backend
            docker image prune -f

      - name: Backend health check
        run: |
          curl -fsS --max-time 10 "http://${{ secrets.EC2_BACKEND_HOST }}:${{ secrets.BACKEND_PORT || '8000' }}/up"

  deploy-frontend:
    name: Build and deploy frontend to EC2 frontend host
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install frontend dependencies
        working-directory: front-end
        run: npm ci

      - name: Build frontend bundle
        working-directory: front-end
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          test -n "$VITE_API_BASE_URL"
          npm run build

      - name: Prepare frontend deploy directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            FRONTEND_DEPLOY_DIR="${{ secrets.FRONTEND_DEPLOY_DIR || '/var/www/html' }}"
            if command -v apt-get >/dev/null 2>&1 && ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y nginx
            fi

            sudo mkdir -p "$FRONTEND_DEPLOY_DIR"
            sudo chown -R "$USER:$USER" "$FRONTEND_DEPLOY_DIR"
            find "$FRONTEND_DEPLOY_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

            if command -v nginx >/dev/null 2>&1; then
              sudo tee /etc/nginx/sites-available/default >/dev/null <<NGINXEOF
            server {
                listen 80 default_server;
                listen [::]:80 default_server;

                root $FRONTEND_DEPLOY_DIR;
                index index.html;

                location / {
                    try_files \$uri \$uri/ /index.html;
                }
            }
            NGINXEOF
              sudo nginx -t
              sudo systemctl enable --now nginx
            fi

      - name: Upload dist folder to frontend EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "front-end/dist/*"
          target: "${{ secrets.FRONTEND_DEPLOY_DIR || '/var/www/html' }}"
          strip_components: 2
          overwrite: true

      - name: Restart frontend web server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            if command -v nginx >/dev/null 2>&1; then
              sudo nginx -t
              sudo systemctl reload nginx || sudo systemctl restart nginx
            fi

      - name: Frontend smoke test
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          curl -fsS --max-time 10 "http://${{ secrets.EC2_FRONTEND_HOST }}"
          curl -fsS --max-time 10 "$VITE_API_BASE_URL/products"
